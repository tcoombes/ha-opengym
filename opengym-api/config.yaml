name: openGym API
version: "1.3.8"
slug: opengym_api
description: openGym backend - profiles, passkeys, workout history
url: https://gitlab.com/DuarteSantos8/opengym
arch:
  - aarch64
  - amd64
init: false
# /share is HA's shared folder, visible over the Samba add-on as \\<pi>\share.
# Only used when mcp_export is on.
map:
  - type: share
    read_only: false
# Settings from https://opengym.duarte-santos.ch/docs.html#env
# The four below are required. Everything marked ? in the schema is optional:
# leave it unset and openGym's own default applies. In the Configuration tab,
# switch on "Show unused optional configuration options" to see them.
options:
  rp_id: gym.tcoombes.co.uk
  origin: https://gym.tcoombes.co.uk
  rp_name: openGym
  api_port: 3000
  extra_env: []
schema:
  rp_id: str
  origin: url
  rp_name: str
  api_port: port
  session_days: int?
  admin_uids: str?
  invite_only: bool?
  allow_guest: bool?
  audit_log: bool?
  audit_max: int?
  audit_days: int?
  audit_ip: list(off|net|full)?
  vapid_subject: str?
  coach_disabled: bool?
  coach_job_timeout_ms: int?
  # Publish a read-only snapshot for openGym's MCP server to /share/opengym-mcp
  mcp_export: bool?
  mcp_export_minutes: int?
  # Escape hatch for anything added upstream later: KEY=value, one per entry.
  extra_env:
    - str
