# openGym reverse proxy vhost
#
# Drop in /etc/nginx/sites-available/ and symlink into sites-enabled/, or
# /etc/nginx/conf.d/ depending on your layout. Replace HA_PI_IP below.
#
# The one line that really matters is `proxy_set_header Host $host;`. openGym
# validates the WebAuthn origin server-side against ORIGIN, so if the proxy
# rewrites Host the browser sees one origin and the API checks another, and
# every login fails with "verification failed". Hand-written nginx configs are
# the usual culprit for exactly this.

upstream opengym {
    server HA_PI_IP:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gym.tcoombes.co.uk;

    # certbot writes challenges here; everything else goes to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gym.tcoombes.co.uk;

    ssl_certificate     /etc/letsencrypt/live/gym.tcoombes.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym.tcoombes.co.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The PWA posts workout data and JSON imports; 20m is generous headroom.
    client_max_body_size 20m;

    # Service worker and manifest must not be cached by the proxy, or clients
    # get stuck on an old app shell after an update.
    location = /sw.js {
        proxy_pass http://opengym;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/opengym-proxy.conf;
    }

    location / {
        proxy_pass http://opengym;
        include /etc/nginx/snippets/opengym-proxy.conf;
    }

    access_log /var/log/nginx/opengym.access.log;
    error_log  /var/log/nginx/opengym.error.log;
}
