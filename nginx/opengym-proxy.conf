# Save as /etc/nginx/snippets/opengym-proxy.conf
# Shared proxy headers for the openGym vhost.

proxy_http_version 1.1;

# Host must be passed through unchanged - this is what WebAuthn validates
# against. Do not use $proxy_host here.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Keep session cookies working end to end.
proxy_set_header Connection        "";
proxy_pass_request_headers on;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
proxy_buffering       off;
